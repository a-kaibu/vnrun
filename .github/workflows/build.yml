name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
            third_party/siglus_rs/target
            third_party/ethornell-rs/target
          key: cargo-${{ hashFiles('Cargo.lock', 'third_party/*/Cargo.lock') }}
      - run: bash engines/krkr/test.sh
      - run: cargo fmt --check
      - run: cargo test --locked -p vnrun-prep -p vnrun-devserver
      - run: cargo clippy --release -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test web/tests/*.test.mjs
      - run: ./build.sh
      - run: cargo build --release -p vnrun-devserver
      - uses: actions/upload-artifact@v4
        with:
          name: vnrun-dist
          path: dist
