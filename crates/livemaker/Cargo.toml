[package]
name = "livemaker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A LiveMaker 2/3 engine for the browser: reads the vf archive, .lsb charts and .gal pictures and runs them"

[dependencies]
nexas = { path = "../nexas" }
miniz_oxide = "0.8"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
