[package]
name = "yuris"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A YU-RIS engine for the browser: reads YPF archives and compiled scripts (ysbin) and runs them"

[dependencies]
miniz_oxide = "0.8"
encoding_rs = "0.8"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
