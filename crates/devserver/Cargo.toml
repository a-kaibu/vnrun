[package]
name = "vnrun-devserver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Serves the player and one game folder over the vnrun protocol (docs/protocol.md) for local testing"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
