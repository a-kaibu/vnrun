[package]
name = "vnrun-devserver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Serves the player and one game folder over the vnrun protocol (docs/protocol.md) for local testing"

[dependencies]
vnrun-prep = { path = "../prep" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
tempfile = "3"

[dev-dependencies]
sdrs-core = { path = "../../third_party/sdrs/sdrs-core" }
