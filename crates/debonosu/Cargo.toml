[package]
name = "debonosu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "DebonosuWorks' engine (Lua 5.1 scripts in .pak archives) for the browser: the story scenes, without Live2D, 3D scenes or the dungeon"

[dependencies]
nexas = { path = "../nexas" }
luavm = { path = "../luavm" }
fontdue = "0.9"
miniz_oxide = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
