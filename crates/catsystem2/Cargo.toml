[package]
name = "catsystem2"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A CatSystem2 engine for the browser: reads the .int archives, .cst scenes, .fes scripts and .hg3 pictures and runs them"

[dependencies]
nexas = { path = "../nexas" }
miniz_oxide = "0.8"
fontdue = "0.9"
blowfish = "0.9"
byteorder = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
