[package]
name = "eomaia-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Eomaia engine for the browser: wasm-bindgen exports for web/src/engines/eomaia.ts"

[lib]
crate-type = ["cdylib"]

[dependencies]
eomaia = { path = "../eomaia" }
nexas = { path = "../nexas" }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
