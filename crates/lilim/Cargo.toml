[package]
name = "lilim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A LiLiM (AOS) engine for the browser: reads the .aos archives and the ABM/BMP pictures and runs the text scripts"

[dependencies]
nexas = { path = "../nexas" }
vncommon = { path = "../vncommon" }
encoding_rs = "0.8"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
