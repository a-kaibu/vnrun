[package]
name = "qlie"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A QLIE engine for the browser: reads the .pack archives, .b/.dpng pictures and .s scripts and runs them"

[dependencies]
nexas = { path = "../nexas" }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
