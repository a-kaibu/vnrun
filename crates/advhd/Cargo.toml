[package]
name = "advhd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "An AdvHD (WillPlus) engine for the browser: reads .arc archives, runs .ws2 scenario scripts and the Lua UI"

[dependencies]
luavm = { path = "../luavm" }
encoding_rs = "0.8"
nexas = { path = "../nexas" }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
